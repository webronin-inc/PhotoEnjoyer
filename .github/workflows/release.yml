name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow tkinterdnd2 cryptography

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build EXE and Installer
        run: python build.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/PhotoEnjoyer-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest.json
        run: |
          python -c "
          import json, os
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          ver = tag.lstrip('v')
          repo = os.environ['GITHUB_REPOSITORY']
          name = 'PhotoEnjoyer'
          url = f'https://github.com/{repo}/releases/download/{tag}/{name}-Setup-{ver}.exe'
          m = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          m['version'] = ver
          m['download_url'] = url
          m['release_date'] = __import__('datetime').date.today().isoformat()
          Path('manifest.json').write_text(json.dumps(m, ensure_ascii=False, indent=2), encoding='utf-8')
          "

      - name: Sign manifest
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: python tools/sign_manifest.py manifest.json

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update manifest.json [skip ci]"
          git pull --rebase origin main
          git push origin main
